name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh the baked GitHub star count daily (zero client-side external API calls).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Fetch current GitHub star count for static baking
        id: stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARS=$(gh api repos/neuroneural/brainchop --jq '.stargazers_count' 2>/dev/null || echo 646)
          if ! [[ "$STARS" =~ ^[0-9]+$ ]]; then
            STARS=646
          fi
          echo "count=$STARS" >> "$GITHUB_OUTPUT"

      - name: Build production site
        env:
          BRAINCHOP_GH_STARS: ${{ steps.stars.outputs.count }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
